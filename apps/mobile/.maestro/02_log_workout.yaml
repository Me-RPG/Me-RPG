# Logging a 30-minute walk completes this week's "Keep the Road" upkeep.
appId: com.merpg.app
---
- launchApp
- tapOn:
    id: "log-workout"
- tapOn:
    id: "act-walk"
- tapOn:
    id: "minutes"
- eraseText
- inputText: "30"
- tapOn:
    id: "save-workout"
- assertVisible: "Keep the Road done this week"
