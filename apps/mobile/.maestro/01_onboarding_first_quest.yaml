# Onboarding -> start a short questline -> complete the first quest -> read its story.
# Run on a simulator or device with a development build installed:
#   maestro test apps/mobile/.maestro
appId: com.healthrpg.app
---
- launchApp:
    clearState: true
- assertVisible: "A new hero arrives"
- tapOn:
    id: "name"
- inputText: "Rowan"
- tapOn:
    id: "activity-3"
- tapOn:
    id: "begin"
- assertVisible: "This week's upkeep"
- tapOn:
    id: "new-quest"
- tapOn:
    id: "pick-wolves_of_greywood"
- tapOn:
    id: "len-short"
- tapOn:
    id: "begin-questline"
- assertVisible: "The Wolves of Greywood"
- tapOn:
    id: "done-squires_drill"
- assertVisible: "Quest complete: At the Forge"
